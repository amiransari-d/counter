<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Mobile Counter</title>
    <!-- Font Awesome for sleek icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-glow: #8b5cf6;
            --increase-color: #10b981;
            --decrease-color: #ef4444;
            --reset-color: #64748b;
            --phone-bg: #0f172a;
            --screen-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient Glow behind phone */
        .ambient-light {
            position: absolute;
            width: 320px;
            height: 580px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50px;
            filter: blur(40px);
            z-index: 0;
            transition: background 0.5s ease;
        }

        /* Smartphone Frame */
        .phone-container {
            position: relative;
            width: 340px;
            height: 680px;
            background: #090d16;
            border-radius: 48px;
            padding: 12px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 0 2px rgba(255, 255, 255, 0.1),
                inset 0 0 6px rgba(255, 255, 255, 0.2);
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        /* Side Buttons on Phone Frame */
        .phone-container::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 120px;
            width: 4px;
            height: 50px;
            background: #334155;
            border-radius: 4px 0 0 4px;
            box-shadow: 0 60px 0 #334155, 0 110px 0 #334155;
        }

        .phone-container::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 150px;
            width: 4px;
            height: 70px;
            background: #334155;
            border-radius: 0 4px 4px 0;
        }

        /* Inner Phone Screen */
        .phone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            border-radius: 38px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
            transition: background 0.4s ease;
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            padding: 0 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        /* Dynamic Island / Notch */
        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 26px;
            background: #000;
            border-radius: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .camera-lens {
            width: 10px;
            height: 10px;
            background: #0f172a;
            border-radius: 50%;
            border: 2px solid #1e293b;
        }

        /* App Header */
        .app-header {
            text-align: center;
            margin-top: 15px;
        }

        .app-title {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* Display Area */
        .counter-display-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .counter-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 80px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            line-height: 1;
        }

        /* Pulse animation on change */
        .counter-value.bump {
            transform: scale(1.2);
        }

        .counter-label {
            margin-top: 12px;
            font-size: 12px;
            color: #64748b;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        /* Round Buttons Area */
        .controls-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .main-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* Fully Circular Buttons */
        .circle-btn {
            border: none;
            outline: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .circle-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .circle-btn:hover::before {
            opacity: 1;
        }

        .circle-btn:active {
            transform: scale(0.9) translateY(2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Action Specific Round Buttons */
        .btn-large {
            width: 75px;
            height: 75px;
            font-size: 28px;
        }

        .btn-small {
            width: 50px;
            height: 50px;
            font-size: 18px;
        }

        .btn-decrease {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
        }

        .btn-increase {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
        }

        .btn-reset {
            background: linear-gradient(135deg, #475569, #334155);
            color: #cbd5e1;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-reset:hover {
            color: #ffffff;
            transform: rotate(-45deg);
        }

        /* Sound Toggle Switch */
        .sound-toggle {
            position: absolute;
            top: 55px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sound-toggle.active {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.15);
        }

        /* Bottom Home Indicator Bar */
        .home-indicator-container {
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 4px;
        }

        .home-indicator {
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        /* Touch Ripple Effect */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(2.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient background glow -->
    <div class="ambient-light" id="ambientGlow"></div>

    <!-- Phone Frame -->
    <div class="phone-container">
        <!-- Phone Screen -->
        <div class="phone-screen" id="screen">
            
            <!-- Dynamic Island -->
            <div class="dynamic-island">
                <div class="camera-lens"></div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <span id="currentTime">09:41</span>
                <div class="status-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>

            <!-- Sound Toggle Button -->
            <button class="sound-toggle active" id="soundBtn" title="Toggle Sound">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>

            <!-- App Title Header -->
            <div class="app-header">
                <div class="app-title">Tally Counter</div>
            </div>

            <!-- Counter Screen Display -->
            <div class="counter-display-wrapper">
                <div class="counter-value" id="counter">0</div>
                <div class="counter-label" id="statusLabel">Ready</div>
            </div>

            <!-- Controls (Round Buttons) -->
            <div class="controls-container">
                
                <div class="main-buttons">
                    <!-- Minus Button (Gol) -->
                    <button class="circle-btn btn-large btn-decrease" id="btnDecrease" onclick="changeCount(-1)" aria-label="Decrease">
                        <i class="fa-solid fa-minus"></i>
                    </button>

                    <!-- Reset Button (Gol) -->
                    <button class="circle-btn btn-small btn-reset" id="btnReset" onclick="resetCount()" aria-label="Reset">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>

                    <!-- Plus Button (Gol) -->
                    <button class="circle-btn btn-large btn-increase" id="btnIncrease" onclick="changeCount(1)" aria-label="Increase">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

            </div>

            <!-- Home Bar -->
            <div class="home-indicator-container">
                <div class="home-indicator"></div>
            </div>

        </div>
    </div>

    <script>
        // State variables
        let count = 0;
        let soundEnabled = true;

        // Elements
        const counterEl = document.getElementById('counter');
        const ambientGlow = document.getElementById('ambientGlow');
        const screenEl = document.getElementById('screen');
        const statusLabel = document.getElementById('statusLabel');
        const timeEl = document.getElementById('currentTime');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');

        // Audio Context setup for web audio sound effects without external assets
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playBeep(freq, type = 'sine', duration = 0.08) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked");
            }
        }

        // Clock Functionality
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timeEl.innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Increment / Decrement Action
        function changeCount(amount) {
            count += amount;
            updateUI();
            
            if (amount > 0) {
                playBeep(520, 'sine', 0.08); // High beep for increase
                setStatus('Increased', '#10b981');
            } else {
                playBeep(340, 'triangle', 0.08); // Lower tone for decrease
                setStatus('Decreased', '#ef4444');
            }
        }

        // Reset Action
        function resetCount() {
            if (count === 0) return;
            count = 0;
            updateUI();
            playBeep(220, 'sawtooth', 0.15);
            setStatus('Reset Done', '#94a3b8');
        }

        // Update UI states and animations
        function updateUI() {
            counterEl.innerText = count;

            // Trigger Pop Bump Animation
            counterEl.classList.remove('bump');
            void counterEl.offsetWidth; // Force Reflow
            counterEl.classList.add('bump');

            // Dynamic color shift depending on value
            if (count > 0) {
                counterEl.style.color = '#34d399';
                counterEl.style.textShadow = '0 0 25px rgba(52, 211, 153, 0.4)';
                ambientGlow.style.background = 'radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(0,0,0,0) 70%)';
            } else if (count < 0) {
                counterEl.style.color = '#f87171';
                counterEl.style.textShadow = '0 0 25px rgba(248, 113, 113, 0.4)';
                ambientGlow.style.background = 'radial-gradient(circle, rgba(239, 68, 68, 0.35) 0%, rgba(0,0,0,0) 70%)';
            } else {
                counterEl.style.color = '#ffffff';
                counterEl.style.textShadow = '0 0 20px rgba(255, 255, 255, 0.2)';
                ambientGlow.style.background = 'radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, rgba(0,0,0,0) 70%)';
            }
        }

        function setStatus(msg, color) {
            statusLabel.innerText = msg;
            statusLabel.style.color = color;
        }

        // Sound Mute Toggle
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundBtn.classList.add('active');
                soundIcon.className = 'fa-solid fa-volume-high';
            } else {
                soundBtn.classList.remove('active');
                soundIcon.className = 'fa-solid fa-volume-xmark';
            }
        });

        // Add Touch Ripple Effect to Circular Buttons
        document.querySelectorAll('.circle-btn').forEach(button => {
            button.addEventListener('click', function (e) {
                const circle = document.createElement('span');
                const diameter = Math.max(this.clientWidth, this.clientHeight);
                const radius = diameter / 2;

                const rect = this.getBoundingClientRect();
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = this.querySelector('.ripple');
                if (ripple) ripple.remove();

                this.appendChild(circle);
            });
        });

        // Keyboard Shortcut Support
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') {
                changeCount(1);
            } else if (e.key === '-' || e.key === 'ArrowDown') {
                changeCount(-1);
            } else if (e.key.toLowerCase() === 'r') {
                resetCount();
            }
        });
    </script>
</body>
</html>
